
ekf_filter_node:
  ros__parameters:

    use_sim_time: true

    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true

    # Initially run in parallel for evaluation.
    publish_tf: true
    publish_acceleration: false

    print_diagnostics: true

    # Coordinate frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ------------------------------------------
    # Wheel odometry
    # ------------------------------------------

    odom0: /odom_cov

    # State order:
    # x, y, z
    # roll, pitch, yaw
    # vx, vy, vz
    # vroll, vpitch, vyaw
    # ax, ay, az

    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]

    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ------------------------------------------
    # IMU
    # ------------------------------------------

    imu0: /imu

    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false

    imu0_remove_gravitational_acceleration: false
